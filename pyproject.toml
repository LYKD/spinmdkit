[build-system]
requires = [
  "setuptools>=77",
  "wheel",
  "pybind11>=2.13",
]
build-backend = "setuptools.build_meta"

[project]
name = "spinmdkit"
dynamic = ["version"]
description = "Streaming magnetic-moment post-processing for spin molecular dynamics"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "KE LI" }]
keywords = ["GPUMD", "NEP", "spin", "magnetism", "molecular-dynamics"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Physics",
]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8"]
dev = ["build>=1.2", "pytest>=8", "ruff>=0.9"]

[project.scripts]
spinmdkit = "spinmdkit.cli:main"

[project.urls]
Homepage = "https://github.com/LYKD/spinmdkit"
Repository = "https://github.com/LYKD/spinmdkit"
Issues = "https://github.com/LYKD/spinmdkit/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "spinmdkit._version.__version__" }

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-*"
skip = "*-musllinux_*"
test-command = "python -c \"import spinmdkit; assert spinmdkit.backend() == 'native'\""
