name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install compiled package and test dependencies
        run: python -m pip install ".[test]"
      - name: Verify native backend
        run: python -c "import spinmdkit; assert spinmdkit.backend() == 'native'"
      - name: Run tests
        run: python -m pytest -q
      - name: Run CLI smoke test
        run: spinmdkit inspect examples/afm_frame/trajectory.xyz --species U --sublattice-pattern "+--+" --json

  plot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install ".[test,plot]"
      - run: python -m pytest tests/test_visualization.py -q
      - name: Run moment plot smoke test
        run: >-
          spinmdkit plot-moments
          examples/moment_time_evolution/trajectory.xyz
          --species U --timestep 0.001 --sample-every 100
          --time-offset 0.2 --time-unit ps --moment-unit mu_B
          --output "${{ runner.temp }}/moment_time_evolution.png"
